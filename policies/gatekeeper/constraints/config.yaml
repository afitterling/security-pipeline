# Gatekeeper-wide: namespaces exempt from both admission and audit
apiVersion: config.gatekeeper.sh/v1alpha1
kind: Config
metadata:
  name: config
  namespace: gatekeeper-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  match:
    - excludedNamespaces: ["kube-system", "gatekeeper-system", "local-path-storage"]
      processes: ["*"]
