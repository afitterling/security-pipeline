{{- if eq .Values.mode "aws" }}
{{ include "bootstrap.app" (dict "name" "external-secrets" "wave" 0) }}
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.versions.externalSecrets | quote }}
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: {{ .Values.aws.roles.externalSecrets }}
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
        webhook:
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
        certController:
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  {{ include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
