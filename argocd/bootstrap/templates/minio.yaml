{{- if eq .Values.mode "local" }}
{{ include "bootstrap.app" (dict "name" "minio" "wave" 0) }}
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: "5.x"
    helm:
      releaseName: minio
      valuesObject:
        mode: standalone
        replicas: 1
        existingSecret: {{ .Values.local.minio.secret }}
        persistence:
          enabled: true
          size: {{ .Values.local.minio.storage }}
        buckets:
          - name: {{ .Values.local.minio.bucket }}
            policy: none
            purge: false
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 1Gi }
        consoleService:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.local.minio.namespace }}
  {{ include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
