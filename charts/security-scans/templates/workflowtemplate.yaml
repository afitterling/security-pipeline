apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: security-scan
  labels:
    app.kubernetes.io/part-of: security-pipeline
spec:
  entrypoint: pipeline
  serviceAccountName: {{ .Values.serviceAccount.name }}
  arguments:
    parameters:
      - name: project
      - name: repo
      - name: ref
        value: main
      - name: version
        value: main
      - name: semgrep
        value: "true"
      - name: gate-critical
        value: "0"
      - name: gate-high         # "" = report only
        value: ""
      - name: gate-epss         # block when any finding has EPSS >= this; "" = off
        value: "0.1"
      - name: gate-policy       # block | report | off  (Dependency-Track policy violations)
        value: block
      - name: testflight        # "true" (tag appleapp + appstore: block) → gate-passed run = TestFlight candidate
        value: "false"
      - name: tags              # comma-separated Dependency-Track project tags (visibility + tags:)
        value: ""
      - name: deploy-enabled
        value: "true"
      - name: stage
        value: dev
      - name: commands          # JSON {install,build,test,deploy} overriding detection
        value: "{}"
  # Argo's default (OnWorkflowSuccess) keeps the work PVC of every failed run: ~1.5-2.5 GB each
  # (source + tool caches) filled the 60 GB kind disk. Reports are archived before the run ends.
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.defaults.workspaceSize }}
  volumes:
    - name: detect
      configMap:
        name: security-scan-detect
        defaultMode: 0555
  podMetadata:
    labels:
      app.kubernetes.io/part-of: security-pipeline
      security-pipeline/project: "{{ "{{" }}workflow.parameters.project{{ "}}" }}"
  securityContext:
    fsGroup: 1000
  templates:
    # ---------------------------------------------------------------- DAG
    #   clone ─┬─ detect ── build-test ──────────────┐
    #          ├─ sbom ── upload-bom ── dtrack-policy ┤                ┌─ deploy ──────────┐
    #          ├─ trivy ──────────────────────────────┼─ gate ─────────┤                   ├─ archive ── verdict
    #          ├─ gitleaks ───────────────────────────┤                └─ release-candidate┘
    #          └─ semgrep (optional) ─────────────────┘
    - name: pipeline
      dag:
        tasks:
          - name: clone
            template: clone
          - name: detect
            template: detect
            depends: clone
          - name: build-test
            template: build-test
            depends: detect
          - name: sbom
            template: sbom
            depends: clone
          - name: trivy
            template: trivy
            depends: clone
          - name: gitleaks
            template: gitleaks
            depends: clone
          - name: semgrep
            template: semgrep
            depends: clone
            when: "{{ "{{" }}workflow.parameters.semgrep{{ "}}" }} == true"
          - name: upload-bom
            template: upload-bom
            depends: sbom
          - name: dtrack-policy
            template: dtrack-policy
            depends: upload-bom
          - name: gate
            template: gate
            depends: "trivy && gitleaks && dtrack-policy && build-test && (semgrep.Succeeded || semgrep.Skipped || semgrep.Failed)"
          - name: release-candidate
            template: release-candidate
            depends: "gate.Succeeded"
            when: "{{ "{{" }}workflow.parameters.testflight{{ "}}" }} == true"
          - name: deploy
            template: deploy
            depends: "gate.Succeeded"
            when: "{{ "{{" }}tasks.detect.outputs.parameters.deploy-enabled{{ "}}" }} == true"
          - name: archive
            template: archive
            depends: "(deploy.Succeeded || deploy.Failed || deploy.Skipped || deploy.Omitted) && (release-candidate.Succeeded || release-candidate.Failed || release-candidate.Skipped || release-candidate.Omitted) || gate.Failed"
          # Referencing gate.Failed above makes Argo treat a gate failure as "expected", so the
          # workflow would end Succeeded. This last task turns a failed gate into a failed workflow.
          - name: verdict
            template: verdict
            depends: "archive"
            arguments:
              parameters:
                - { name: gate-status, value: "{{ "{{" }}tasks.gate.status{{ "}}" }}" }

    # ---------------------------------------------------------------- source
    - name: clone
      container:
        image: {{ .Values.images.git }}
        command: [sh, -ec]
        args:
          - |
            mkdir -p /work/out
            rm -rf /work/src   # retry after a failed attempt
            if [ -n "$GIT_TOKEN" ]; then
              host=$(echo "{{ "{{" }}workflow.parameters.repo{{ "}}" }}" | sed -E 's#https?://([^/]+)/.*#\1#')
              printf 'https://%s:%s@%s\n' "$GIT_USERNAME" "$GIT_TOKEN" "$host" > /tmp/.git-credentials
              git config --global credential.helper 'store --file=/tmp/.git-credentials'
            fi
            git clone --depth 1 --branch "{{ "{{" }}workflow.parameters.ref{{ "}}" }}" \
              "{{ "{{" }}workflow.parameters.repo{{ "}}" }}" /work/src
            cd /work/src
            git rev-parse HEAD > /work/out/commit.txt
            chmod -R a+rwX /work
            echo "commit $(cat /work/out/commit.txt)"
        env:
          - name: GIT_USERNAME
            valueFrom: { secretKeyRef: { name: git-credentials, key: username, optional: true } }
          - name: GIT_TOKEN
            valueFrom: { secretKeyRef: { name: git-credentials, key: token, optional: true } }
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      # Transient on a busy local cluster: DNS (CoreDNS), API timeouts, Dependency-Track restarts
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff: { duration: "30s", factor: "2" }

    # Inspect the repo: sst.config.ts → npx sst deploy, package.json → npm, python, terraform…
    - name: detect
      container:
        image: {{ .Values.images.runner }}
        command: [node, /detect/detect.js]
        env:
          - name: DEPLOY_STAGE
            value: "{{ "{{" }}workflow.parameters.stage{{ "}}" }}"
          - name: DEPLOY_ENABLED
            value: "{{ "{{" }}workflow.parameters.deploy-enabled{{ "}}" }}"
          - name: COMMANDS_JSON
            value: "{{ "{{" }}workflow.parameters.commands{{ "}}" }}"
        volumeMounts:
          - { name: work, mountPath: /work }
          - { name: detect, mountPath: /detect }
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      outputs:
        parameters:
          - name: plan
            valueFrom: { path: /work/out/plan.json }
          - name: deploy-enabled
            valueFrom: { path: /work/out/deploy-enabled.txt }

    - name: build-test
      container:
        image: {{ .Values.images.runner }}
        command: [bash, -ec]
        args:
          - |
            cd /work/src
            plan=/work/out/plan.json
            get() { node -e "process.stdout.write(require('$plan').$1 || '')"; }
            echo "kind: $(get kind)"
            for step in install build test; do
              cmd=$(get $step)
              if [ -z "$cmd" ]; then echo "--- $step: (none)"; continue; fi
              echo "--- $step: $cmd"
              bash -ec "$cmd" 2>&1 | tee -a /work/out/build-$step.log
            done
        env:
          - { name: CI, value: "true" }
          - { name: NO_COLOR, value: "1" }
          - { name: npm_config_cache, value: /work/.npm }
          - { name: HOME, value: /work/.home }
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.runner | nindent 10 }}
      activeDeadlineSeconds: 2400

    # ---------------------------------------------------------------- scanners
    - name: sbom
      container:
        image: {{ .Values.images.syft }}
        args:
          - scan
          - dir:/work/src
          - --source-name={{ "{{" }}workflow.parameters.project{{ "}}" }}
          - --source-version={{ "{{" }}workflow.parameters.version{{ "}}" }}
          - -o
          - cyclonedx-json=/work/out/sbom.cdx.json
          - -o
          - spdx-json=/work/out/sbom.spdx.json
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.scanner | nindent 10 }}

    - name: trivy
      container:
        image: {{ .Values.images.trivy }}
        command: [sh, -ec]
        args:
          - |
            trivy fs --scanners vuln,secret,misconfig --format json \
              --output /work/out/trivy.json --exit-code 0 /work/src
            trivy fs --scanners vuln,secret,misconfig --format sarif \
              --output /work/out/trivy.sarif --exit-code 0 --skip-db-update /work/src
            trivy fs --scanners vuln --severity HIGH,CRITICAL --skip-db-update /work/src || true
        env:
          - name: TRIVY_CACHE_DIR
            value: /work/.trivy
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.scanner | nindent 10 }}
      # The 120 MB vulnerability DB download from mirror.gcr.io breaks off now and then
      retryStrategy:
        limit: "2"
        retryPolicy: Always
        backoff: { duration: "30s", factor: "2" }

    - name: gitleaks
      container:
        image: {{ .Values.images.gitleaks }}
        command: [sh, -ec]
        args:
          - |
            gitleaks detect --source /work/src --no-git --redact \
              --report-format json --report-path /work/out/gitleaks.json --exit-code 0
            n=$(grep -c '"RuleID"' /work/out/gitleaks.json || true)
            echo "gitleaks findings: $n"
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}

    - name: semgrep
      container:
        image: {{ .Values.images.semgrep }}
        command: [sh, -ec]
        args:
          - |
            semgrep scan --config p/default --config p/secrets --metrics=off \
              --json --output /work/out/semgrep.json --sarif-output /work/out/semgrep.sarif \
              --error-on-findings=false /work/src || true
            echo "semgrep done"
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.scanner | nindent 10 }}
      activeDeadlineSeconds: 1800

    - name: upload-bom
      container:
        image: {{ .Values.images.curl }}
        command: [sh, -ec]
        args:
          - |
            if [ -z "$DTRACK_API_KEY" ]; then
              echo "dtrack-api secret is empty — run scripts/dtrack-bootstrap.sh"; exit 1
            fi
            resp=$(curl -sS --fail-with-body -X POST "$DTRACK_URL/api/v1/bom" \
              -H "X-Api-Key: $DTRACK_API_KEY" \
              -F "autoCreate=true" \
              -F "projectName={{ "{{" }}workflow.parameters.project{{ "}}" }}" \
              -F "projectVersion={{ "{{" }}workflow.parameters.version{{ "}}" }}" \
              -F "bom=@/work/out/sbom.cdx.json")
            echo "$resp" > /work/out/dtrack-upload.json
            echo "upload token: $resp"
        env:
          - name: DTRACK_URL
            value: {{ .Values.dependencyTrack.url }}
          - name: DTRACK_API_KEY
            valueFrom: { secretKeyRef: { name: dtrack-api, key: apiKey, optional: true } }
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        backoff: { duration: "60s", factor: "2" }   # Dependency-Track may be restarting

    # Tag the Dependency-Track project (public/private + tags: from projects.yaml), wait for it to
    # finish analysing the uploaded BOM, then collect policy violations and EPSS. Always exits 0; on
    # error it writes {"error":...} and the gate decides (fails closed).
    - name: dtrack-policy
      container:
        image: {{ .Values.images.k8s }}   # curl + jq
        command: [sh, -ec]
        args:
          - |
            out=/work/out
            pol=$out/dtrack-policy.json
            api() { curl -sS --fail-with-body -H "X-Api-Key: $DTRACK_API_KEY" "$@"; }
            bail() { jq -n --arg e "$1" '{error:$e, fail:0, warn:0, info:0, approved:0, violations:[]}' > $pol
                     [ -s $out/epss.json ] || jq -n --arg e "$1" '{error:$e, max:0, high:0, top:[]}' > $out/epss.json
                     echo "dtrack-policy: $1"; exit 0; }
            token=$(jq -r '.token // empty' $out/dtrack-upload.json 2>/dev/null || true)
            [ -n "$token" ] || bail "no upload token"
            waited=0
            while [ "$(api "$DTRACK_URL/api/v1/event/token/$token" | jq -r .processing)" != false ]; do
              [ $waited -ge "$TIMEOUT" ] && bail "BOM analysis not finished after ${TIMEOUT}s"
              sleep 5; waited=$((waited + 5))
            done
            echo "BOM analysed after ${waited}s"
            lookup() { api -G "$DTRACK_URL/api/v1/project/lookup" --data-urlencode "name=$PROJECT" \
              --data-urlencode "version=$VERSION" 2>/dev/null | jq -r '.uuid // empty' 2>/dev/null || true; }
            uuid=$(lookup)
            if [ -z "$uuid" ]; then
              # autoCreate happens while the BOM is processed; a Dependency-Track restart loses that
              # queued event. Upload once more and wait again.
              echo "project $PROJECT/$VERSION missing after analysis: uploading the BOM again"
              token=$(api -X POST "$DTRACK_URL/api/v1/bom" -F autoCreate=true -F "projectName=$PROJECT" \
                -F "projectVersion=$VERSION" -F "bom=@$out/sbom.cdx.json" | jq -r '.token // empty') || bail "re-upload failed"
              waited=0
              while [ "$(api "$DTRACK_URL/api/v1/event/token/$token" | jq -r .processing)" != false ]; do
                [ $waited -ge "$TIMEOUT" ] && bail "BOM analysis not finished after ${TIMEOUT}s (re-upload)"
                sleep 5; waited=$((waited + 5))
              done
              for i in 1 2 3 4 5 6; do uuid=$(lookup); [ -n "$uuid" ] && break; sleep 10; done
            fi
            [ -n "$uuid" ] || bail "project $PROJECT/$VERSION not found"
            # Tags: keep tags added in the UI, add ours; public/private are exclusive
            if [ -n "$TAGS" ]; then
              api "$DTRACK_URL/api/v1/project/$uuid" | jq -c --arg want "$TAGS" '
                ($want | ascii_downcase | split(",") | map(select(. != ""))) as $w
                | ([.tags[]?.name] as $have
                   | ($have | map(select(. as $t | (["public","private"] | index($t)) == null or ($w | index($t)) != null)))
                     + $w | unique) as $new
                | if ($new | sort) == ([.tags[]?.name] | sort) then empty else {tags: ($new | map({name: .}))} end' > /tmp/tags.json || true
              if [ -s /tmp/tags.json ]; then
                api -X PATCH -H "Content-Type: application/json" -d @/tmp/tags.json "$DTRACK_URL/api/v1/project/$uuid" >/dev/null \
                  && echo "tags: $(jq -r '[.tags[].name] | join(",")' /tmp/tags.json)" || echo "WARNING: could not set tags"
              fi
            fi
            # EPSS: probability of exploitation in the next 30 days (FIRST.org), per finding. Collected
            # before the policy check so it also works with gate.policy off; an error makes the EPSS gate fail closed.
            min=${EPSS_MIN:-0.1}
            api "$DTRACK_URL/api/v1/finding/project/$uuid?suppressed=false" > /tmp/f.json \
              && jq --argjson min "$min" '
              { threshold: $min, findings: length,
                unscored: [.[] | select(.vulnerability.epssScore == null)] | length,
                max: ([.[].vulnerability.epssScore // 0] | max // 0),
                high: [.[] | select((.vulnerability.epssScore // 0) >= $min)] | length,
                top: (sort_by(-(.vulnerability.epssScore // 0)) | .[:20] | map({
                  vuln: .vulnerability.vulnId, component: "\(.component.name)@\(.component.version // "")",
                  severity: .vulnerability.severity, epss: .vulnerability.epssScore,
                  percentile: .vulnerability.epssPercentile })) }' /tmp/f.json > $out/epss.json \
              || jq -n '{error:"finding query failed", max:0, high:0, top:[]}' > $out/epss.json
            jq -r '.error // "EPSS max \(.max)  findings with EPSS >= \(.threshold): \(.high)  (\(.unscored)/\(.findings) without EPSS)"' $out/epss.json
            [ -n "$GATE_POLICY" ] && [ "$GATE_POLICY" != off ] || bail "policy gate off"
            page=1; : > /tmp/v.jsonl
            while :; do
              api "$DTRACK_URL/api/v1/violation/project/$uuid?suppressed=false&pageSize=500&pageNumber=$page" > /tmp/p.json \
                || bail "violation query failed (API key needs VIEW_POLICY_VIOLATION: rerun scripts/dtrack-bootstrap.sh)"
              jq -c '.[]' /tmp/p.json >> /tmp/v.jsonl
              [ "$(jq length /tmp/p.json)" -lt 500 ] && break; page=$((page + 1))
            done
            jq -s '
              def open: (.analysis.analysisState // "NOT_SET") != "APPROVED";
              def count($s): [.[] | select(.policyCondition.policy.violationState == $s and open)] | length;
              { fail: count("FAIL"), warn: count("WARN"), info: count("INFO"),
                approved: [.[] | select(open | not)] | length,
                violations: [.[] | { component: "\(.component.name)@\(.component.version // "")",
                                     policy: .policyCondition.policy.name,
                                     state: .policyCondition.policy.violationState, type,
                                     analysis: (.analysis.analysisState // "NOT_SET") }] }' /tmp/v.jsonl > $pol
            jq -c '{fail, warn, info, approved}' $pol
            jq -r '.violations[] | select(.state == "FAIL" and .analysis != "APPROVED") | "  FAIL \(.policy): \(.component)"' $pol | head -30
        env:
          - { name: DTRACK_URL, value: {{ .Values.dependencyTrack.url | quote }} }
          - name: DTRACK_API_KEY
            valueFrom: { secretKeyRef: { name: dtrack-api, key: apiKey, optional: true } }
          - { name: PROJECT, value: "{{ "{{" }}workflow.parameters.project{{ "}}" }}" }
          - { name: VERSION, value: "{{ "{{" }}workflow.parameters.version{{ "}}" }}" }
          - { name: GATE_POLICY, value: "{{ "{{" }}workflow.parameters.gate-policy{{ "}}" }}" }
          - { name: TAGS, value: "{{ "{{" }}workflow.parameters.tags{{ "}}" }}" }
          - { name: TIMEOUT, value: {{ .Values.dependencyTrack.analysisTimeoutSeconds | quote }} }
          - { name: EPSS_MIN, value: "{{ "{{" }}workflow.parameters.gate-epss{{ "}}" }}" }
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      activeDeadlineSeconds: 1200

    # ---------------------------------------------------------------- gate
    - name: gate
      container:
        image: {{ .Values.images.k8s }}   # alpine/k8s: sh + jq (the jq image is distroless, no shell)
        command: [sh, -ec]
        args:
          - |
            crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /work/out/trivy.json)
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' /work/out/trivy.json)
            secrets=$(jq '[.Results[]?.Secrets[]?] | length' /work/out/trivy.json)
            leaks=$(jq 'length' /work/out/gitleaks.json 2>/dev/null || echo 0)
            sg=$(jq '.results | length' /work/out/semgrep.json 2>/dev/null || echo 0)
            pol=/work/out/dtrack-policy.json
            pfail=$(jq '.fail // 0' $pol 2>/dev/null || echo 0)
            pwarn=$(jq '.warn // 0' $pol 2>/dev/null || echo 0)
            perr=$(jq -r '.error // empty' $pol 2>/dev/null || echo "no dtrack-policy.json")
            emax=$(jq '.max // 0' /work/out/epss.json 2>/dev/null || echo 0)
            ehigh=$(jq '.high // 0' /work/out/epss.json 2>/dev/null || echo 0)
            eerr=$(jq -r '.error // empty' /work/out/epss.json 2>/dev/null || echo "no epss.json")
            gpol="{{ "{{" }}workflow.parameters.gate-policy{{ "}}" }}"
            ghigh="{{ "{{" }}workflow.parameters.gate-high{{ "}}" }}"
            gepss="{{ "{{" }}workflow.parameters.gate-epss{{ "}}" }}"
            jq -n --arg project "{{ "{{" }}workflow.parameters.project{{ "}}" }}" \
                  --arg commit "$(cat /work/out/commit.txt)" \
                  --arg kind "$(jq -r .kind /work/out/plan.json)" \
                  --argjson critical "$crit" --argjson high "$high" \
                  --argjson trivySecrets "$secrets" --argjson gitleaks "$leaks" --argjson semgrep "$sg" \
                  --argjson policyFail "$pfail" --argjson policyWarn "$pwarn" --arg policyError "$perr" --arg policyGate "$gpol" \
                  --argjson epssMax "$emax" --argjson epssHigh "$ehigh" --arg epssGate "$gepss" --arg epssError "$eerr" \
                  '{project:$project, commit:$commit, kind:$kind, critical:$critical, high:$high, trivySecrets:$trivySecrets, gitleaks:$gitleaks, semgrep:$semgrep,
                    policyGate:$policyGate, policyFail:$policyFail, policyWarn:$policyWarn, policyError:$policyError,
                    epssGate:$epssGate, epssMax:$epssMax, epssHigh:$epssHigh, epssError:$epssError}' \
                  | tee /work/out/summary.json
            fail=0
            [ "$crit" -gt "{{ "{{" }}workflow.parameters.gate-critical{{ "}}" }}" ] && { echo "GATE: critical $crit > {{ "{{" }}workflow.parameters.gate-critical{{ "}}" }}"; fail=1; }
            [ -n "$ghigh" ] && [ "$high" -gt "$ghigh" ] && { echo "GATE: high $high > $ghigh"; fail=1; }
            if [ -n "$gepss" ]; then
              [ -n "$eerr" ] && { echo "GATE: no EPSS data, failing closed: $eerr"; fail=1; }
              if [ "$ehigh" -gt 0 ]; then
                echo "GATE: $ehigh findings with EPSS >= $gepss (likely exploited)"; fail=1
                jq -r --argjson min "$gepss" '.top[] | select((.epss // 0) >= $min) | "  EPSS \(.epss)  \(.vuln)  \(.component)  \(.severity)"' /work/out/epss.json
              fi
            fi
            [ "$leaks" -gt 0 ] && { echo "GATE: $leaks leaked secrets (gitleaks)"; fail=1; }
            if [ "$gpol" = block ]; then
              [ -n "$perr" ] && { echo "GATE: Dependency-Track policy check failed closed: $perr"; fail=1; }
              [ "$pfail" -gt 0 ] && { echo "GATE: $pfail Dependency-Track policy violations in state FAIL (approve or fix them)"; fail=1; }
            fi
            [ "$fail" = 0 ] && echo "GATE: passed — deploy allowed"
            exit $fail
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      outputs:
        parameters:
          - name: summary
            valueFrom: { path: /work/out/summary.json }

    # ---------------------------------------------------------------- deploy
    # Runs the detected/declared deploy command (SST: npx sst deploy --stage <stage>) with the
    # deployer IRSA role. Profiles pinned in sst.config.ts are mapped onto that same identity.
    - name: deploy
      serviceAccountName: {{ .Values.serviceAccount.deploy }}
      container:
        image: {{ .Values.images.runner }}
        command: [bash, -ec]
        args:
          - |
            cd /work/src
            plan=/work/out/plan.json
            cmd=$(node -e "process.stdout.write(require('$plan').deploy || '')")
            [ -n "$cmd" ] || { echo "no deploy command"; exit 0; }
            if [ -n "${AWS_ROLE_ARN:-}" ]; then
              # EKS: map profiles pinned in sst.config.ts onto the pod's IRSA identity
              mkdir -p "$HOME/.aws"
              for p in $(node -e "console.log((require('$plan').profiles||[]).join(' '))"); do
                printf '[profile %s]\nrole_arn = %s\nweb_identity_token_file = %s\nregion = %s\n\n' \
                  "$p" "$AWS_ROLE_ARN" "$AWS_WEB_IDENTITY_TOKEN_FILE" "$AWS_REGION" >> "$HOME/.aws/config"
                echo "profile '$p' from sst.config.ts mapped to pipeline identity"
              done
            else
              # local: ~/.aws from the developer machine is mounted read-only at $HOME/.aws
              ls "$HOME/.aws" >/dev/null 2>&1 && echo "using mounted ~/.aws (local mode)" || echo "WARNING: no AWS credentials available"
            fi
            echo "--- deploy: $cmd"
            bash -ec "$cmd" 2>&1 | tee /work/out/deploy.log
        env:
          - { name: CI, value: "true" }
          - { name: NO_COLOR, value: "1" }
          - { name: AWS_REGION, value: {{ .Values.aws.region }} }
          - { name: AWS_DEFAULT_REGION, value: {{ .Values.aws.region }} }
          - { name: npm_config_cache, value: /work/.npm }
          - { name: HOME, value: /work/.home }
        volumeMounts:
          - { name: work, mountPath: /work }
          {{- if eq .Values.mode "local" }}
          - { name: aws-credentials, mountPath: /work/.home/.aws, readOnly: true }
          {{- end }}
        resources: {{ toYaml .Values.resources.runner | nindent 10 }}
      {{- if eq .Values.mode "local" }}
      volumes:
        - name: aws-credentials
          secret:
            secretName: {{ .Values.local.awsCredentialsSecret }}
            optional: true
      {{- end }}
      activeDeadlineSeconds: 3600

    # ---------------------------------------------------------------- release candidate
    # Gate passed and the project ships to the App Store: remember this commit. The release itself is
    # a separate, manually started workflow (upload-to-testflight) so a pending approval never blocks the
    # one-at-a-time scan queue. Own SA: the scanner SA (which runs repo code) cannot write candidates.
    - name: release-candidate
      serviceAccountName: {{ .Values.serviceAccount.release }}
      container:
        image: {{ .Values.images.k8s }}
        command: [sh, -ec]
        args:
          - |
            kubectl create configmap "release-candidate-$PROJECT" --dry-run=client -o yaml \
              --from-literal=project="$PROJECT" --from-literal=ref="$REF" \
              --from-literal=commit="$(cat /work/out/commit.txt)" \
              --from-literal=workflow="$WORKFLOW" --from-literal=time="$(date +%s)" \
              --from-file=summary.json=/work/out/summary.json \
              | kubectl label --local -f - -o yaml app.kubernetes.io/part-of=security-pipeline security-pipeline/release-candidate=true \
              | kubectl apply -f -
            echo "TestFlight candidate: $PROJECT @ $(cat /work/out/commit.txt) — upload with scripts/release.sh $PROJECT"
        env:
          - { name: PROJECT, value: "{{ "{{" }}workflow.parameters.project{{ "}}" }}" }
          - { name: REF, value: "{{ "{{" }}workflow.parameters.ref{{ "}}" }}" }
          - { name: WORKFLOW, value: "{{ "{{" }}workflow.name{{ "}}" }}" }
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}

    # ---------------------------------------------------------------- archive → S3
    - name: verdict
      inputs:
        parameters: [{ name: gate-status }]
      container:
        image: {{ .Values.images.k8s }}
        command: [sh, -ec]
        args: ['[ "{{ "{{" }}inputs.parameters.gate-status{{ "}}" }}" = Succeeded ] && echo "gate passed" || { echo "gate {{ "{{" }}inputs.parameters.gate-status{{ "}}" }}: workflow failed"; exit 1; }']
        resources: {{ toYaml .Values.resources.small | nindent 10 }}

    - name: archive
      container:
        image: {{ .Values.images.curl }}
        command: [sh, -ec]
        args: ["rm -rf /work/out/.trivy; ls -la /work/out"]
        volumeMounts: [{ name: work, mountPath: /work }]
        resources: {{ toYaml .Values.resources.small | nindent 10 }}
      outputs:
        artifacts:
          - name: reports
            path: /work/out
            archive: { none: {} }
